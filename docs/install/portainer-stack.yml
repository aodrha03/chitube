# 포테이너 방법 B: 서버에서 `docker build -t chitube:latest .` 로 이미지를 만든 뒤 Stacks → Web editor 에 붙여 넣기
# volumes 의 왼쪽 경로를 서버 실제 경로로 바꾸세요.
# Portainer option B: build the image on the server with `docker build -t chitube:latest .`, then paste this into Stacks → Web editor.
# Change the left side of each volumes path to a real path on your server.
services:
  chitube:
    image: chitube:latest
    container_name: chitube
    ports:
      - "8945:8000"
    environment:
      - TZ=Asia/Seoul
      - PUID=0
      - PGID=0
    volumes:
      - /opt/chitube/config:/config     # 설정 · DB · 로그인 정보
      - /mnt/hdd/ChiTube:/downloads     # 받은 영상
      - /:/host                         # 저장 경로를 서버 절대 경로로 쓸 때
    device_cgroup_rules:
      - "c 226:* rmw"                   # 인텔 퀵싱크 자동 연결
    restart: unless-stopped
    init: true                       # 종료 신호를 치튜브에 제대로 전달 (재부팅 때 녹화를 정상 종료하고 빨리 끝남 · 남은 하위 프로그램 정리)
    stop_grace_period: 30s           # 녹화 마무리할 시간 (그 뒤엔 강제 종료)
